name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12 · Ruff · Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install native FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint backend with Ruff
        run: ruff check backend

      - name: Run backend test suite
        run: pytest backend/tests/ -v

  frontend:
    name: Frontend (Node 22 · TypeScript · Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (lockfile)
        run: npm ci

      - name: Type-check with TypeScript
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  docker:
    name: Docker (Compose · Build · Smoke Test)
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: metastudio-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: metastudio-frontend:latest
          build-args: |
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke-test Compose stack and Nginx reverse proxy
        env:
          COMPOSE_PROJECT_NAME: metastudio
        run: |
          docker compose up -d --no-build
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null && \
               curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'; then
              echo "Smoke test passed: frontend & backend proxy are healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test timed out. Dumping container logs:"
          docker compose ps
          docker compose logs --tail=100
          exit 1

      - name: Tear down Compose stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: metastudio
        run: docker compose down -v
