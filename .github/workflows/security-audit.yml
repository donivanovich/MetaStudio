name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly Monday at 06:00 UTC to catch newly disclosed CVEs
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-audit:
    name: Frontend Dependency Audit (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit production npm dependencies (lockfile)
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  backend-audit:
    name: Backend Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies & pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pip-audit

      - name: Audit Python environment for known vulnerabilities
        run: pip-audit --progress-spinner off

  scripts-and-hygiene:
    name: ShellCheck & Repository Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint deployment shell script with ShellCheck
        run: shellcheck scripts/docker-up.sh

      - name: Verify no .env files or private keys are tracked in Git
        run: |
          tracked_secrets="$(git ls-files | grep -E '(^|/)\.env($|\.(?!example))|\.(pem|key|p12|pfx)$' || true)"
          if [[ -n "${tracked_secrets}" ]]; then
            echo "::error::Sensitive files tracked in Git:"
            echo "${tracked_secrets}"
            exit 1
          fi
          echo "Repository hygiene check passed: no .env or private key files tracked."
