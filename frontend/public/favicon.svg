<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ms-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d2433" />
      <stop offset="100%" stop-color="#0d111a" />
    </linearGradient>
    <linearGradient id="ms-rim" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c8fa4e" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#60b6f5" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="ms-lime" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dcff66" />
      <stop offset="100%" stop-color="#98e62e" />
    </linearGradient>
  </defs>

  <!-- Obsidian squircle studio badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#ms-bg)" stroke="url(#ms-rim)" stroke-width="2" />

  <!-- Subtle precision vinyl / signal halo -->
  <circle cx="32" cy="32" r="22" stroke="#c8fa4e" stroke-opacity="0.14" stroke-width="1.5" />

  <!-- Sculpted "M" studio audio waveform bars -->
  <rect x="14.5" y="18" width="5.5" height="28" rx="2.75" fill="url(#ms-lime)" />
  <rect x="22" y="21.5" width="5.5" height="19" rx="2.75" fill="url(#ms-lime)" fill-opacity="0.92" />
  <rect x="29.25" y="28" width="5.5" height="15" rx="2.75" fill="url(#ms-lime)" />
  <rect x="36.5" y="21.5" width="5.5" height="19" rx="2.75" fill="url(#ms-lime)" fill-opacity="0.92" />
  <rect x="44" y="18" width="5.5" height="28" rx="2.75" fill="url(#ms-lime)" />

  <!-- Dual micro tag dots: cyan (language) & amber (mood) -->
  <circle cx="49.5" cy="13.5" r="2.75" fill="#60b6f5" />
  <circle cx="14.5" cy="50.5" r="2.25" fill="#f0ad5e" />
</svg>
