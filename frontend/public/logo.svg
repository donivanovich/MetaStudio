<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" fill="none">
  <defs>
    <linearGradient id="ms-logo-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d2433" />
      <stop offset="100%" stop-color="#0d111a" />
    </linearGradient>
    <linearGradient id="ms-logo-rim" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c8fa4e" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#60b6f5" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="ms-logo-lime" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dcff66" />
      <stop offset="100%" stop-color="#98e62e" />
    </linearGradient>
  </defs>

  <!-- Emblem -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#ms-logo-bg)" stroke="url(#ms-logo-rim)" stroke-width="2" />
  <circle cx="32" cy="32" r="22" stroke="#c8fa4e" stroke-opacity="0.14" stroke-width="1.5" />
  <rect x="14.5" y="18" width="5.5" height="28" rx="2.75" fill="url(#ms-logo-lime)" />
  <rect x="22" y="21.5" width="5.5" height="19" rx="2.75" fill="url(#ms-logo-lime)" fill-opacity="0.92" />
  <rect x="29.25" y="28" width="5.5" height="15" rx="2.75" fill="url(#ms-logo-lime)" />
  <rect x="36.5" y="21.5" width="5.5" height="19" rx="2.75" fill="url(#ms-logo-lime)" fill-opacity="0.92" />
  <rect x="44" y="18" width="5.5" height="28" rx="2.75" fill="url(#ms-logo-lime)" />
  <circle cx="49.5" cy="13.5" r="2.75" fill="#60b6f5" />
  <circle cx="14.5" cy="50.5" r="2.25" fill="#f0ad5e" />

  <!-- Wordmark -->
  <text
    x="78"
    y="35"
    fill="#f4f6fa"
    font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, sans-serif"
    font-size="25"
    font-weight="700"
    letter-spacing="-0.6"
  >Meta<tspan fill="#c8fa4e">Studio</tspan></text>
  <text
    x="79"
    y="51"
    fill="#9199ab"
    font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="10.5"
    letter-spacing="1.4"
  >ID3 METADATA STUDIO</text>
</svg>
